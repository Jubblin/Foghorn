name: Version bump

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Bump version on PR
    runs-on: ubuntu-latest
    # Cannot push to forks from the base repo workflow
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Require VERSION_BUMP_TOKEN
        env:
          VERSION_BUMP_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
        run: |
          if [[ -z "$VERSION_BUMP_TOKEN" ]]; then
            cat <<'MSG' >&2
          ::error::VERSION_BUMP_TOKEN secret is required.

          Pushing version bumps with GITHUB_TOKEN attributes them to
          github-actions[bot]. GitHub then holds follow-up PR workflow
          runs for manual approval (changelog 2026-06-11).

          One-time setup (run locally):
            1. Create a fine-grained PAT for this repo with
               Contents: Read and write, Pull requests: Read and write
               (or use: gh auth token | gh secret set VERSION_BUMP_TOKEN)
            2. gh secret set VERSION_BUMP_TOKEN
            3. Re-run this workflow

          See docs/RELEASE.md § "Avoid workflows awaiting approval".
          MSG
            exit 1
          fi

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # Must be a human/app PAT — not GITHUB_TOKEN — so bump commits
          # do not hit the bot-PR workflow approval gate.
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
          persist-credentials: true

      - name: Skip if last commit is a version bump
        id: skip
        run: |
          MSG=$(git log -1 --pretty=%s)
          if [[ "$MSG" == chore\(version\):* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping — last commit is already a version bump"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine bump type
        if: steps.skip.outputs.skip != 'true'
        id: bump_type
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          TYPE="patch"

          if [[ "$EVENT_ACTION" == "opened" ]]; then
            LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
            if echo "$LABELS" | grep -qx 'version:major'; then
              TYPE="major"
            elif echo "$LABELS" | grep -qx 'version:minor'; then
              TYPE="minor"
            elif echo "$LABELS" | grep -qx 'version:patch'; then
              TYPE="patch"
            fi
          elif [[ "$EVENT_ACTION" == "labeled" ]]; then
            case "$EVENT_LABEL" in
              version:major) TYPE="major" ;;
              version:minor) TYPE="minor" ;;
              version:patch) TYPE="patch" ;;
              *)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Ignoring non-version label: $EVENT_LABEL"
                exit 0
                ;;
            esac
          elif [[ "$EVENT_ACTION" == "synchronize" ]]; then
            TYPE="build"
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.skip.outputs.skip != 'true' && steps.bump_type.outputs.skip != 'true'
        id: bump
        run: |
          chmod +x scripts/bump-version.sh
          OUTPUT=$(./scripts/bump-version.sh "${{ steps.bump_type.outputs.type }}")
          echo "$OUTPUT"
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done <<< "$OUTPUT"

      - name: Commit and push
        if: steps.skip.outputs.skip != 'true' && steps.bump_type.outputs.skip != 'true'
        run: |
          git config user.name "foghorn-version-bump"
          git config user.email "foghorn-version-bump@users.noreply.github.com"
          git add Foghorn.xcodeproj/project.pbxproj
          git commit -m "chore(version): bump to ${{ steps.bump.outputs.marketing_version }} (build ${{ steps.bump.outputs.build_number }})"
          git push

      - name: Comment on PR
        if: steps.skip.outputs.skip != 'true' && steps.bump_type.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.VERSION_BUMP_TOKEN }}
          script: |
            const version = '${{ steps.bump.outputs.marketing_version }}';
            const build = '${{ steps.bump.outputs.build_number }}';
            const type = '${{ steps.bump.outputs.bump_type }}';
            const body = `**Version bumped** (\`${type}\`): \`${version}\` (build \`${build}\`)`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
