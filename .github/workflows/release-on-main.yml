name: Release on main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  tag:
    name: Tag continuous build
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip release-only commits
        id: skip
        run: |
          set -euo pipefail
          MSG=$(git log -1 --pretty=%s)
          echo "commit_message=$MSG" >> "$GITHUB_OUTPUT"
          case "$MSG" in
            chore\(release\):*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping — release dispatch commit"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Create and push build tag
        id: tag
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/read-marketing-version.sh scripts/read-build-number.sh
          VERSION="$(./scripts/read-marketing-version.sh)"
          BUILD="$(./scripts/read-build-number.sh)"
          TAG="v${VERSION}-build.${BUILD}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping push"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Continuous build ${VERSION} (${BUILD})"
          git push origin "$TAG"

      - name: Dispatch release workflow
        if: steps.skip.outputs.skip != 'true' && steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping dispatch"
            exit 0
          fi
          gh workflow run release.yml --ref main -f tag="$TAG"

      - name: Summary
        if: steps.skip.outputs.skip != 'true'
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "### Continuous release tagged"
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- Dispatched: \`release.yml\` (GitHub DMG)"
          } >> "$GITHUB_STEP_SUMMARY"
