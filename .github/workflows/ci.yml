name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    # Nothing here needs macOS, and each run already takes four macOS slots.
    # Lint used to queue behind them — observed 23m for a 17s job (#89).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run SwiftLint
        # Pinned to the version Homebrew installs locally (0.65.1) so CI and
        # developer machines flag the same violations. The image's entrypoint is
        # already swiftlint, so the args start at the subcommand — passing
        # "swiftlint lint" makes it treat "swiftlint" as a path to lint.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057 \
            lint --quiet

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Check docs site sync
        run: ./scripts/sync-docs-site.sh --check

  test:
    name: Test
    runs-on: macos-26
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:FoghornTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  ui-test:
    name: UI Test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Run UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Debug \
            -derivedDataPath build-ui \
            -destination 'platform=macOS' \
            -only-testing:FoghornUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  build:
    name: Build Release
    runs-on: macos-26
    needs: test
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build release app
        run: |
          xcodebuild \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Foghorn-app
          path: build/Build/Products/Release/Foghorn.app
          if-no-files-found: error
          retention-days: 7

  # Advisory only: never blocks Quality / Test / UI Test / Build Release.
  # Managed Scan App check (semgrep-cloud-platform/scan) is separate; keep
  # Fail Open enabled in Semgrep and do not require that check to merge.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep@sha256:f1f7b71861c7b28b6e0f661225a2c4f58a484f5d0f182465c6d6b3b22f972ade
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep (soft-fail)
        run: semgrep ci || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
