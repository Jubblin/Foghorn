name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install quality tools
        run: brew install swiftlint shellcheck

      - name: Run SwiftLint
        run: swiftlint lint --quiet

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  test:
    name: Test
    runs-on: macos-26
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:FoghornTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  ui-test:
    name: UI Test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Run UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Debug \
            -derivedDataPath build-ui \
            -destination 'platform=macOS' \
            -only-testing:FoghornUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  build:
    name: Build Release
    runs-on: macos-26
    needs: test
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build release app
        run: |
          xcodebuild \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Foghorn-app
          path: build/Build/Products/Release/Foghorn.app
          if-no-files-found: error
          retention-days: 7
