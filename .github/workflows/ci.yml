name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install quality tools
        run: brew install swiftlint shellcheck

      - name: Run SwiftLint
        run: swiftlint lint --quiet

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  test:
    name: Test
    runs-on: macos-15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Online.xcodeproj \
            -scheme Online \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  build:
    name: Build Release
    runs-on: macos-15
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build release app
        run: |
          xcodebuild \
            -project Online.xcodeproj \
            -scheme Online \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Online-app
          path: build/Build/Products/Release/Online.app
          if-no-files-found: error
          retention-days: 7
