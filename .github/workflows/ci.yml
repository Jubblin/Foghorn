name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    # Nothing here needs macOS, and macOS slots are capped at 5 per account.
    # Lint used to queue behind them — observed 23m for a 17s job (#89).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run SwiftLint
        # Pinned to the version Homebrew installs locally (0.65.1) so CI and
        # developer machines flag the same violations. The image's entrypoint is
        # already swiftlint, so the args start at the subcommand — passing
        # "swiftlint lint" makes it treat "swiftlint" as a path to lint.
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057 \
            lint --quiet

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Test release scripts
        run: ./scripts/test-scripts.sh

      - name: Check docs site sync
        run: ./scripts/sync-docs-site.sh --check

  test:
    name: Test
    runs-on: macos-26
    needs: quality
    # Unit and UI suites share one macOS job: they build the same scheme, and
    # GitHub caps concurrent macOS jobs at 5 per account (#92). Building once
    # with build-for-testing also drops a duplicate ~70s build.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

      # Two steps, not one -only-testing run: a red step name says which suite
      # failed without opening the log.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:FoghornTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

      - name: Run UI smoke tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:FoghornUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  build:
    name: Build Release
    runs-on: macos-26
    needs: test
    # main only: this verifies the Release configuration compiles, which does not
    # vary per PR, and Test already builds Debug. On PRs it cost a macOS slot for
    # ~71s of duplicate signal (#92).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build release app
        run: |
          xcodebuild \
            -project Foghorn.xcodeproj \
            -scheme Foghorn \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Foghorn-app
          path: build/Build/Products/Release/Foghorn.app
          if-no-files-found: error
          retention-days: 7

  # Advisory only: never blocks Quality / Test / Build Release.
  # Managed Scan App check (semgrep-cloud-platform/scan) is separate; keep
  # Fail Open enabled in Semgrep and do not require that check to merge.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep@sha256:51c9f53a4fce0d55e9abd08d7b96968654248a4b1122e77f20e0a49c0072446c
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep (soft-fail)
        run: semgrep ci || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
