name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install quality tools
        run: brew install swiftlint shellcheck

      - name: Run SwiftLint
        run: swiftlint lint --quiet

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  test:
    name: Test
    runs-on: macos-26
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Online.xcodeproj \
            -scheme Online \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:OnlineTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  ui-test:
    name: UI Test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Run UI smoke tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test \
            -project Online.xcodeproj \
            -scheme Online \
            -configuration Debug \
            -derivedDataPath build-ui \
            -destination 'platform=macOS' \
            -only-testing:OnlineUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO
        env:
          NSUnbufferedIO: YES

  build:
    name: Build Release
    runs-on: macos-26
    needs: test
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Build release app
        run: |
          xcodebuild \
            -project Online.xcodeproj \
            -scheme Online \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Online-app
          path: build/Build/Products/Release/Online.app
          if-no-files-found: error
          retention-days: 7
