name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build DMG
        id: build
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-dmg.sh scripts/build-signed-dmg.sh scripts/ci-setup-keychain.sh
          if [[ -n "${DEVELOPER_ID_CERTIFICATE_P12:-}" || -n "${APPLE_CERTIFICATE_P12:-}" ]]; then
            ./scripts/build-signed-dmg.sh Release
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO ./scripts/build-dmg.sh Release
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          REF_VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_VERSION="${REF_VERSION%%-build.*}"
          BUILD_SUFFIX=""
          if [[ "$REF_VERSION" == *-build.* ]]; then
            BUILD_SUFFIX="${REF_VERSION#*-build.}"
          fi

          chmod +x scripts/extract-changelog-section.sh scripts/extract-changelog-unreleased.sh scripts/read-marketing-version.sh scripts/read-build-number.sh

          {
            if [[ -n "$BUILD_SUFFIX" ]]; then
              MARKETING_VERSION="$(./scripts/read-marketing-version.sh)"
              BUILD_NUMBER="$(./scripts/read-build-number.sh)"
              echo "## Continuous build"
              echo ""
              echo "- **Version:** ${MARKETING_VERSION} (build ${BUILD_NUMBER})"
              echo "- **Tag:** ${GITHUB_REF_NAME}"
              echo ""
            fi

            if ./scripts/extract-changelog-section.sh "$CHANGELOG_VERSION" >/dev/null 2>&1; then
              ./scripts/extract-changelog-section.sh "$CHANGELOG_VERSION"
            else
              ./scripts/extract-changelog-unreleased.sh
            fi

            cat <<'FOOTER'

          ---

          ### Install

          1. Download `Online.dmg` below
          2. Open the DMG and drag **Online** to Applications
          3. Grant notification permission on first launch

          **Requirements:** macOS 14 Sonoma or later
          FOOTER
            if [[ "${{ steps.build.outputs.signed }}" == "true" ]]; then
              echo ""
              echo "> Signed and notarized Developer ID build."
            else
              echo ""
              echo "> Unsigned build. Configure signing secrets for a notarized DMG."
            fi
          } > release-notes.md

          {
            echo 'body<<EOF'
            cat release-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ARGS=(release create "$REF_NAME" --title "Online $REF_NAME" --notes-file release-notes.md build/Online.dmg)
          if [[ "$REF_NAME" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"
