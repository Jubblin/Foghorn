name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Build DMG
        id: build
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-dmg.sh scripts/build-signed-dmg.sh scripts/ci-setup-keychain.sh
          if [[ -n "${DEVELOPER_ID_CERTIFICATE_P12:-}" || -n "${APPLE_CERTIFICATE_P12:-}" ]]; then
            ./scripts/build-signed-dmg.sh Release
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO ./scripts/build-dmg.sh Release
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/extract-changelog-section.sh
          {
            ./scripts/extract-changelog-section.sh "$VERSION"
            cat <<'FOOTER'

          ---

          ### Install

          1. Download `Online.dmg` below
          2. Open the DMG and drag **Online** to Applications
          3. Grant notification permission on first launch

          **Requirements:** macOS 14 Sonoma or later
          FOOTER
            if [[ "${{ steps.build.outputs.signed }}" == "true" ]]; then
              echo ""
              echo "> Signed and notarized Developer ID build."
            else
              echo ""
              echo "> Unsigned build. Configure signing secrets for a notarized DMG."
            fi
          } > release-notes.md

          {
            echo 'body<<EOF'
            cat release-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: Online ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: build/Online.dmg
