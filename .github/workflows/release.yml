name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v0.2.13-build.30)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Build DMGs (arm64 + amd64)
        id: build
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-dmg.sh scripts/build-signed-dmg.sh scripts/package-dmg.sh scripts/ci-setup-keychain.sh scripts/resolve-release-arch.sh
          RELEASE_VERSION="${RELEASE_TAG#v}"
          export RELEASE_VERSION
          SIGNED=true
          HAS_CERT=false
          if [[ -n "${DEVELOPER_ID_CERTIFICATE_P12:-}" || -n "${APPLE_CERTIFICATE_P12:-}" ]]; then
            HAS_CERT=true
          else
            SIGNED=false
          fi

          build_one() {
            local arch="$1"
            if [[ "$HAS_CERT" == "true" ]]; then
              if ./scripts/build-signed-dmg.sh Release "$arch"; then
                return 0
              fi
              echo "::warning::Signed $arch build failed; falling back to unsigned DMG"
              SIGNED=false
            fi
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO ./scripts/build-dmg.sh Release "$arch"
          }

          build_one arm64
          build_one amd64

          {
            echo "signed=${SIGNED}"
            echo "version=${RELEASE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          REF_VERSION="${RELEASE_TAG#v}"
          CHANGELOG_VERSION="${REF_VERSION%%-build.*}"
          BUILD_SUFFIX=""
          if [[ "$REF_VERSION" == *-build.* ]]; then
            BUILD_SUFFIX="${REF_VERSION#*-build.}"
          fi

          chmod +x scripts/extract-changelog-section.sh scripts/extract-changelog-unreleased.sh scripts/read-marketing-version.sh scripts/read-build-number.sh

          {
            if [[ -n "$BUILD_SUFFIX" ]]; then
              MARKETING_VERSION="$(./scripts/read-marketing-version.sh)"
              BUILD_NUMBER="$(./scripts/read-build-number.sh)"
              echo "## Continuous build"
              echo ""
              echo "- **Version:** ${MARKETING_VERSION} (build ${BUILD_NUMBER})"
              echo "- **Tag:** ${RELEASE_TAG}"
              echo ""
            fi

            if ./scripts/extract-changelog-section.sh "$CHANGELOG_VERSION" >/dev/null 2>&1; then
              ./scripts/extract-changelog-section.sh "$CHANGELOG_VERSION"
            else
              ./scripts/extract-changelog-unreleased.sh
            fi

            cat <<FOOTER

          ---

          ### Install

          1. Download the DMG for your Mac below:
             - Apple Silicon: \`Online-${RELEASE_VERSION}-arm64.dmg\`
             - Intel: \`Online-${RELEASE_VERSION}-amd64.dmg\`
          2. Open the DMG and drag **Online** onto **Applications**
          3. Grant notification permission on first launch

          Installed copies can update in-app via **Settings → Help → Check for Updates…** (Sparkle).

          **Requirements:** macOS 14 Sonoma or later
          FOOTER
            if [[ "${{ steps.build.outputs.signed }}" == "true" ]]; then
              echo ""
              echo "> Signed and notarized Developer ID build."
            else
              echo ""
              echo "> Unsigned build. Configure signing secrets for a notarized DMG."
            fi
          } > release-notes.md

          {
            echo 'body<<EOF'
            cat release-notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Sparkle update feed
        id: sparkle
        if: steps.build.outputs.signed == 'true'
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-sparkle-feed.sh
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::warning::SPARKLE_PRIVATE_KEY not configured; skipping Sparkle feed"
            echo "prepared=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANNEL=""
          if [[ "$RELEASE_TAG" == *-* ]]; then
            CHANNEL="prerelease"
          fi
          RELEASE_TAG="$RELEASE_TAG" SPARKLE_CHANNEL="$CHANNEL" ./scripts/prepare-sparkle-feed.sh
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ env.RELEASE_TAG }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
          SPARKLE_PREPARED: ${{ steps.sparkle.outputs.prepared }}
        run: |
          set -euo pipefail
          ARM_DMG="build/Online-${RELEASE_VERSION}-arm64.dmg"
          AMD_DMG="build/Online-${RELEASE_VERSION}-amd64.dmg"
          ASSETS=("$ARM_DMG" "$AMD_DMG")
          if [[ "${SPARKLE_PREPARED:-}" == "true" ]]; then
            ASSETS+=(
              "build/sparkle-feed/Online-${RELEASE_VERSION}.zip"
              "docs/appcast.xml"
            )
          fi
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$REF_NAME" --title "Online $REF_NAME" --notes-file release-notes.md
            if [[ "$REF_NAME" == *-* ]]; then
              gh release edit "$REF_NAME" --prerelease
            else
              gh release edit "$REF_NAME" --latest
            fi
          else
            ARGS=(release create "$REF_NAME" --title "Online $REF_NAME" --notes-file release-notes.md "${ASSETS[@]}")
            if [[ "$REF_NAME" == *-* ]]; then
              ARGS+=(--prerelease)
            fi
            gh "${ARGS[@]}"
          fi

          if [[ "${SPARKLE_PREPARED:-}" == "true" ]]; then
            if gh release view sparkle-appcast >/dev/null 2>&1; then
              gh release upload sparkle-appcast docs/appcast.xml --clobber
            else
              gh release create sparkle-appcast docs/appcast.xml \
                --title "Sparkle appcast" \
                --notes "Rolling Sparkle appcast feed for in-app updates. Not an Online app release." \
                --prerelease
            fi
          fi
