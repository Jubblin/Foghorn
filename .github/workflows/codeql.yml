name: CodeQL

# Advanced setup (checked-in workflow), swift only — #111. Default setup has no
# hook to cache SPM dependencies before autobuild runs, so Sparkle was
# recompiled from source on every PR (~15 of the job's ~29 minutes). The
# "actions" language analysis stays on default setup; it's cheap (no
# autobuild) and unaffected by this.
#
# Owner for keeping actions/query packs current: @Jubblin (single-maintainer
# repo).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly, matches the prior default-setup schedule

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Cache resolved SPM dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Foghorn.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          languages: swift

      - name: Autobuild
        uses: github/codeql-action/autobuild@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          category: "/language:swift"
