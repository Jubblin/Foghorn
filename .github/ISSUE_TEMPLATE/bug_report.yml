name: Bug report
description: Report incorrect connectivity detection, crashes, or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Foghorn probes your network locally — please avoid pasting sensitive hostnames if they identify internal infrastructure.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect vs what actually happened?
      placeholder: macOS showed WiFi connected but Foghorn alerted offline for 30s after wake...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to WiFi with captive portal
        2. Close laptop lid for 5 minutes
        3. Open lid
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Foghorn version
      description: Menu bar → About, or GitHub Release tag
      placeholder: 0.1.0 (build 1)
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 14.5 Sonoma
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network type
      options:
        - Wi-Fi
        - Ethernet
        - VPN
        - iPhone USB tethering
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Outage log excerpt (optional)
      description: Redact hostnames if needed. Path `~/Library/Application Support/Foghorn/outages.json`
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I can reproduce this on the latest release or main branch
          required: true
